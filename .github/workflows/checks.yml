name: 서비스 검증

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies from pyproject.toml
        run: python -m pip install -e ".[analytics,dev]"
      - name: Run Ruff lint and format checks
        run: |
          ruff check .
          ruff format --check .
      - name: Run Mypy static type check
        run: mypy service/ src/
      - name: Run Pytest with 80% coverage gate
        run: pytest --cov=service --cov=src --cov-fail-under=80
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Frontend JS unit tests
        run: node --test tests/test_journal.cjs tests/test_analysis.cjs tests/test_reports.cjs
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run UI verification
        run: python scripts/check_service_ui.py
      - name: Build Docker image
        run: docker build .
