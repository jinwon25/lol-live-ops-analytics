name: Riot KR 최근 경기 수집
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/historic-batch.yml'
      - 'orchestration/riot/**'
      - 'scripts/collect_riot_meta.py'
      - 'service/meta.py'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/historic-batch.yml'
      - 'orchestration/riot/**'
permissions:
  contents: read
concurrency:
  group: riot-collection-${{ github.event_name == 'pull_request' && github.run_id || 'live' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/orchestration/riot/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 실행 환경 준비
        run: |
          python -m venv "$RUNNER_TEMP/service"
          "$RUNNER_TEMP/service/bin/pip" install . pytest
          echo "SERVICE_PYTHON=$RUNNER_TEMP/service/bin/python" >> "$GITHUB_ENV"
          pip install apache-airflow==3.4.0 --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.11.txt
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow"
          echo "AIRFLOW_HOME=$AIRFLOW_HOME" >> "$GITHUB_ENV"
          airflow db migrate
      - name: DAG 구성과 경기 집계 검사
        run: |
          python - <<'PY'
          from orchestration.riot.dags.riot_recent_matches import riot_recent_matches_dag as dag
          assert dag.get_task('validate_report').upstream_task_ids == {'collect_matches'}
          assert dag.get_task('collect_matches').upstream_task_ids == {'sync_catalogue'}
          PY
          "$SERVICE_PYTHON" -m pytest tests/test_meta.py -q -o addopts=""
      # 실행마다 40경기로는 챔피언·포지션별 최소 30경기에 닿지 않아, 7일 체크포인트를 이어서 누적한다.
      - name: 이전 수집 체크포인트 복원
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .local/meta-active-checkpoint.json
          key: riot-kr-meta-${{ github.run_id }}
          restore-keys: riot-kr-meta-
      - name: Riot API 배치 실행
        if: github.event_name != 'pull_request'
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          : "${RIOT_API_KEY:?Set RIOT_API_KEY in repository secrets}"
          airflow dags test riot_recent_matches
      - name: 수집 범위와 실제 호출량 기록
        if: success() && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('service/data/current_meta.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(f"KR 솔로랭크 · 패치 {report['scope']['patch']}", file=summary)
              print(f"경기 {report['games']}건 · 참여자 {report['participants']}행", file=summary)
              print(f"Riot API 호출 {report['collection']['calls_this_run']}회 · 이번 실행 제외 {report['collection']['excluded_this_run']}건", file=summary)
              ready = sum(item['win_rate'] is not None for item in report['items'])
              print(f"최소 {report['minimum_games']}경기를 채운 챔피언·포지션 {ready}개", file=summary)
          PY
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: kr-solo-meta-${{ github.run_id }}-${{ github.run_attempt }}
          path: service/data/current_meta.json
          if-no-files-found: error
          retention-days: 30
      - name: 수집 체크포인트 저장
        if: always() && github.event_name != 'pull_request' && hashFiles('.local/meta-active-checkpoint.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .local/meta-active-checkpoint.json
          key: riot-kr-meta-${{ github.run_id }}-${{ github.run_attempt }}
