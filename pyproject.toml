[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-live-ops-analytics"
version = "0.4.0"
description = "League of Legends LiveOps analytics pipeline, DuckDB/Parquet evidence layer, and coaching API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2,<3",
    "redis>=5,<6",
    "duckdb>=1.0,<2",
    "structlog>=24.1,<26",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "openpyxl>=3.1,<4",
    "requests>=2.31,<3",
    "pyarrow>=15.0,<20",
]

[project.optional-dependencies]
analytics = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "openpyxl>=3.1,<4",
    "pyarrow>=15.0,<20",
    "requests>=2.31,<3",
]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "playwright>=1.46,<2",
]

[tool.setuptools.packages.find]
include = ["service*", "src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is enforced by `ruff format`; remaining E501 hits are long user-facing string literals.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These entry points must extend sys.path / configure matplotlib before importing project modules.
"scripts/*.py" = ["E402"]
"src/replot_personas.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["service", "src", "scripts"]

[tool.ruff.format]
quote-style = "preserve"


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.coverage.run]
source = ["service", "src"]
omit = [
    "src/inspect_raw.py",
    "src/replot_personas.py",
    "src/sample_check.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
